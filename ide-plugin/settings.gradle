pluginManagement {
    repositories {
        gradlePluginPortal()
        // Maven Central mirror — kept ahead of mavenCentral for networks
        // where repo.maven.apache.org is unreachable.
        maven { url = 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
        maven { url = 'https://cache-redirector.jetbrains.com/intellij-repository' }
    }
}

plugins {
    // Auto-provisions the JDK 21 toolchain needed to compile against
    // IntelliJ 2025.3 (Java 21) when the build host only has JDK 17.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'luamap-idea-plugin'
