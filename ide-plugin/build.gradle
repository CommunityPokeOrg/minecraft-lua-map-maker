plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.2.1'
}

version = pluginVersion
group = 'org.communitypoke'

// JDK 21 toolchain is required to read IntelliJ 2025.3 (v65) class files;
// foojay-resolver auto-provisions it on JDK-17 hosts. release=17 keeps
// bytecode runnable on every supported IDE (2024.1+ ships JBR 17 or 21).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaUltimate(platformVersion.toString())
        instrumentationTools()
        pluginVerifier()
    }

    // Gson ships on the IDE classpath at runtime; declare it for tests.
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The platform's `test` task runs inside the IDE runtime (PathClassLoader,
// coroutines javaagent) — broken on the unified 2025.3 distro and unneeded
// for our pure-JVM bridge/session unit tests. Disable it and run them on a
// plain JVM via `unitTest` instead (wired into `check`).
test {
    enabled = false
}

tasks.register('unitTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

check {
    dependsOn tasks.named('unitTest')
}

// Boots the IDE headless to index settings UI — the plugin has no settings
// page and this crashes on the JBR's coroutines agent, so skip it.
tasks.named('buildSearchableOptions') { enabled = false }

// Guard the compatibility range that actually ships: since=241 must be
// present and until-build must stay absent (unbounded) in the packaged
// plugin.xml — otherwise new IDE builds refuse to load the plugin.
tasks.register('verifyPluginXml') {
    description = 'Verifies packaged plugin.xml compatibility range'
    dependsOn tasks.named('buildPlugin')
    doLast {
        def zip = layout.buildDirectory.dir('distributions').get().asFile
            .listFiles().find { it.name == "luamap-idea-plugin-${pluginVersion}.zip" }
        assert zip != null : "plugin zip not found"
        def readEntry = { java.util.zip.ZipInputStream s ->
            def out = new java.io.ByteArrayOutputStream()
            s.transferTo(out)
            return out.toByteArray()
        }
        byte[] inner = null
        new java.util.zip.ZipInputStream(zip.newInputStream()).withCloseable { s ->
            def e; while ((e = s.nextEntry) != null) {
                if (e.name ==~ /luamap-idea-plugin\/lib\/luamap-idea-plugin-[^-]*\.jar/) {
                    inner = readEntry(s)
                    break
                }
            }
        }
        assert inner != null : "plugin jar not found inside zip"
        String xml = null
        new java.util.zip.ZipInputStream(
                new java.io.ByteArrayInputStream(inner)).withCloseable { s ->
            def e; while ((e = s.nextEntry) != null) {
                if (e.name == 'META-INF/plugin.xml') {
                    xml = new String(readEntry(s), 'UTF-8')
                    break
                }
            }
        }
        assert xml != null : "META-INF/plugin.xml missing"
        assert xml.contains("since-build=\"${pluginSinceBuild}\"") :
            "unexpected since-build in plugin.xml"
        assert !xml.contains('until-build') :
            "until-build must be absent (unbounded) in plugin.xml"
    }
}

check {
    dependsOn tasks.named('verifyPluginXml')
}

intellijPlatform {
    pluginConfiguration {
        id = 'org.communitypoke.luamap.idea'
        name = 'LuaMap Tools'
        version = pluginVersion.toString()
        ideaVersion {
            sinceBuild = pluginSinceBuild.toString()
            // Unset until-build: absent property → no until-build
            // attribute → plugin accepts all future IDE builds.
            untilBuild = provider { null }
        }
    }
}
