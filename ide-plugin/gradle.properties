# LuaMap IntelliJ plugin
pluginVersion = 0.3.1
# Since 2025.3 JetBrains ships a single unified "IntelliJ IDEA" archive
# (ideaIU) — there is no separate ideaIC build. The plugin only uses core
# platform APIs, so building against IU stays compatible with IC installs.
platformType = IU
# Compile target: IDEA 2025.3 (build 253.*) — the same line --setup-ide provisions.
# Requires a JDK 21 toolchain (auto-provisioned by foojay-resolver).
platformVersion = 2025.3
# Minimum IDE line: 2024.1 (241.*). until-build intentionally unset so the
# plugin keeps working on newer IDEs (see build.gradle verifyPluginXml).
pluginSinceBuild = 241
org.gradle.jvmargs=-Xmx2G
